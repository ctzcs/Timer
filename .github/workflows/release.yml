name: Release

# 推送 v* 标签时自动：构建 windows exe → 打包 zip → 创建 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > version.go <<EOF
          package main

          // Code generated by CI from ${GITHUB_REF_NAME}; do not edit.
          var appVersion = "$VERSION"
          EOF

      - name: Vet and test
        shell: bash
        run: |
          go vet ./...
          go test ./...

      - name: Build
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/egoist/mygo.production=1" -o timer.exe .

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "timer-${env:GITHUB_REF_NAME}-windows-amd64.zip"
          Compress-Archive -Path timer.exe, README.md, README.zh-CN.md -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v pat="^## \\[${VERSION}\\]" '
            $0 ~ pat { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # CHANGELOG 里没有对应段落时给个兜底标题
          if [ ! -s notes.md ]; then
            echo "Automatic release ${GITHUB_REF_NAME}" > notes.md
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
