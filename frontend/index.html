<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>桌面计时器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="device" id="device">
    <div class="bar" id="bar"></div>
    <div class="lcd" id="lcd">
      <span class="digits ghost">88.88</span>
      <span class="digits" id="digits">30.00</span>
    </div>
    <!-- 顶栏只放高频操作：时长、±、开始暂停、归零、隐藏；开关类设置在托盘/设置窗口 -->
    <div class="controls" id="controls">
      <span class="dur" id="durWrap">
        <input id="mins" inputmode="numeric" maxlength="2" value="30" /><span id="unit">分</span>
      </span>
      <span class="ctl-gap"></span>
      <button class="ctl" data-act="m5">−5</button>
      <button class="ctl" data-act="m1">−1</button>
      <button class="ctl ctl-main" data-act="toggle">▶</button>
      <button class="ctl" data-act="p1">+1</button>
      <button class="ctl" data-act="p5">+5</button>
      <span class="ctl-gap"></span>
      <button class="ctl" data-act="reset">↺</button>
      <button class="ctl" data-act="hide">✕</button>
    </div>
  </div>
  <script src="./i18n.js"></script>
  <script src="./timer.js"></script>
</body>
</html>
