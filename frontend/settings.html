<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>设置</title>
  <link rel="stylesheet" href="./settings.css" />
</head>
<body>
  <div class="card">
    <h1 id="t-settings">设置</h1>

    <div class="row">
      <label id="t-language" for="lang">语言</label>
      <select id="lang">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="rule"></div>

    <div class="row">
      <label id="t-alarm" for="alarm">到点铃声</label>
      <select id="alarm">
        <option value="once"></option>
        <option value="10"></option>
        <option value="30"></option>
        <option value="loop"></option>
      </select>
    </div>

    <label class="row chk">
      <input type="checkbox" id="sound" />
      <span id="t-sound">提示音</span>
    </label>
    <label class="row chk">
      <input type="checkbox" id="anim" />
      <span id="t-anim">动态效果</span>
    </label>
    <label class="row chk">
      <input type="checkbox" id="ontop" />
      <span id="t-ontop">窗口置顶</span>
    </label>
    <label class="row chk">
      <input type="checkbox" id="autostart" />
      <span id="t-autostart">开机自启</span>
    </label>

    <div class="rule"></div>

    <div class="row">
      <label id="t-update">软件更新</label>
      <button id="upd" class="btn">检查更新</button>
    </div>
    <div id="upd-status" class="upd-status"></div>

    <div class="ver">v</div>
  </div>
  <script src="./i18n.js"></script>
  <script src="./settings.js"></script>
</body>
</html>
